<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* No scrolling */
            background-color: #101010; /* Deep Black */
            color: #DFDFDF; /* Light Gray */
            font-family: sans-serif;
        }

        /* Example of using the primary brand accent color */
        ::selection {
            background-color: #A476FF; /* Purple */
            color: #101010;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        button {
            background-color: #A476FF; /* Purple */
            color: #101010;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        button:active {
            background-color: #DFDFDF;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Plain home page with no header and no footer -->
    </div>
</body>
</html>
