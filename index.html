<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* No scrolling */
            background-color: #101010; /* Deep Black */
            color: #DFDFDF; /* Light Gray */
            font-family: sans-serif;
        }

        /* Example of using the primary brand accent color */
        ::selection {
            background-color: #A476FF; /* Purple */
            color: #101010;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5em;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2em;
        }

        button {
            background-color: #A476FF; /* Purple */
            color: #101010;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p>This is a plain home page.</p>
        <button>Click Me</button>
    </div>
</body>
</html>
